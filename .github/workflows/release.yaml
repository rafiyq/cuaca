on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  linux:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: x86_64-linux
          - target: aarch64-unknown-linux-gnu
            name: aarch64-linux
    steps:
      - uses: actions/checkout@v4
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.target }}
          cache-targets: true
      - name: Install cross
        if: matrix.name == 'aarch64-linux'
        run: cargo install cross
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build (release)
        if: matrix.name == 'x86_64-linux'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Build (release, cross)
        if: matrix.name == 'aarch64-linux'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cross build --release --target ${{ matrix.target }}
      - name: Package artifact
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/cuaca" dist/
          cp README.md dist/
          cp LICENSE dist/
          tar -czf "cuaca-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" -C dist .
      - name: Generate checksum
        run: |
          sha256sum "cuaca-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" > "cuaca-${{ github.ref_name }}-${{ matrix.name }}.tar.gz.sha256"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cuaca-${{ github.ref_name }}-${{ matrix.name }}.tar.gz cuaca-${{ github.ref_name }}-${{ matrix.name }}.tar.gz.sha256
          generate_release_notes: true

  macos:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            name: x86_64-macos
            runner: macos-latest
          - target: aarch64-apple-darwin
            name: aarch64-macos
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.target }}
          cache-targets: true
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build (release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package artifact
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/cuaca" dist/
          cp README.md dist/
          cp LICENSE dist/
          tar -czf "cuaca-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" -C dist .
      - name: Generate checksum
        run: |
          shasum -a 256 "cuaca-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" > "cuaca-${{ github.ref_name }}-${{ matrix.name }}.tar.gz.sha256"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cuaca-${{ github.ref_name }}-${{ matrix.name }}.tar.gz cuaca-${{ github.ref_name }}-${{ matrix.name }}.tar.gz.sha256
          generate_release_notes: true

  windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build (release)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo build --release
      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target\release\cuaca.exe" dist/
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path "dist\cuaca.exe","dist\README.md","dist\LICENSE" -DestinationPath "cuaca-${{ github.ref_name }}-x86_64-windows.zip"
      - name: Generate checksum
        shell: pwsh
        run: |
          $file = "cuaca-${{ github.ref_name }}-x86_64-windows.zip"
          $hash = Get-FileHash -Path $file -Algorithm SHA256
          $hash.Hash | Out-File -FilePath "$file.sha256"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cuaca-${{ github.ref_name }}-x86_64-windows.zip cuaca-${{ github.ref_name }}-x86_64-windows.zip.sha256
          generate_release_notes: true
