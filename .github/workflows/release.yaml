on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  linux:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            name: x86_64-linux
          - target: aarch64-unknown-linux-gnu
            name: aarch64-linux
    steps:
      - uses: actions/checkout@v4
      - name: Install cross
        if: matrix.name == 'aarch64-linux'
        run: cargo install cross
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build (release)
        if: matrix.name == 'x86_64-linux'
        run: cargo build --release --target ${{ matrix.target }}
      - name: Build (release, cross)
        if: matrix.name == 'aarch64-linux'
        run: cross build --release --target ${{ matrix.target }}
      - name: Package artifact
        run: |
          mkdir -p dist
          tar -czf "cuaca-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" \
            -C target/${{ matrix.target }}/release cuaca \
            README.md LICENSE
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "cuaca-${{ github.ref_name }}-${{ matrix.name }}.tar.gz"
          generate_release_notes: true

  macos:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            name: x86_64-macos
            runner: macos-latest
          - target: aarch64-apple-darwin
            name: aarch64-macos
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package artifact
        run: |
          mkdir -p dist
          tar -czf "cuaca-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" \
            -C target/${{ matrix.target }}/release cuaca \
            README.md LICENSE
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "cuaca-${{ github.ref_name }}-${{ matrix.name }}.tar.gz"
          generate_release_notes: true

  windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build (release)
        run: cargo build --release
      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path "target\release\cuaca.exe","README.md","LICENSE" -DestinationPath "cuaca-${{ github.ref_name }}-x86_64-windows.zip"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "cuaca-${{ github.ref_name }}-x86_64-windows.zip"
          generate_release_notes: true
