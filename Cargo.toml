[package]
name = "cuaca"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "A weather indicator for Waybar using BMKG weather data"
repository = "https://github.com/rafiyq/cuaca"
homepage = "https://github.com/rafiyq/cuaca"

[dependencies]
chrono = { version = "0.4.44", features = ["unstable-locales", "serde"] }
clap = { version = "4.6.1", features = ["derive"] }
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
quick-xml = { version = "0.31", features = ["serialize"] }
thiserror = "1"
directories = "5"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
mockito = "1.0"
tempfile = "3"
serial_test = "2"
